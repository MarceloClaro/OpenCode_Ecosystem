name: OpenCode Ecosystem CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest scikit-learn numpy

      - name: R35-R37 Full Suite (36 CTs)
        run: python tests/run_r35_r36_r37.py -v

      - name: Ecosystem CI Validation
        run: python tests/ci_validate.py

      - name: Generate CI badge
        if: always()
        run: |
          echo "## OpenCode Ecosystem CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| R35-R37 (36 CTs) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| CI Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
